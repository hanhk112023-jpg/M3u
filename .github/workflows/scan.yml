# Auto-scan SocoLive rooms and publish the playlist to this repository.
#
# The Python scanner (JSON stringified output) reads publish state from the
# last commit message, so ephemeral runners need no local state: just scan,
# compare, commit when changed. A shared concurrency group is intentionally
# omitted: the scheduled runs are short, so overlaps are rare and the pruning
# step clears any stragglers.
#
# CDN note: api.json.vnres.co blocks datacenter IPs, so every run routes its
# API traffic through a residential VN exit node via the mihomo proxy pool
# from YUNA_SUB_URL. The proxy step verifies the exit IP before scanning.

name: socolive-scan

on:
  # Self-relay keeps the loop alive: the last step calls repository_dispatch
  # with a real PAT (SAS_PAT) — GITHUB_TOKEN can be rate-limited on that
  # endpoint, so we use a dedicated secret PAT instead, which GitHub doesn't
  # throttle the same way.
  repository_dispatch:
    types: [scan]
  schedule:
    - cron: "*/5 * * * *" # best-effort backup; self-relay is the reliable loop
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore fingerprint and republish now"
        type: boolean
        default: false
      workers:
        description: "Concurrent room-detail requests"
        type: number
        default: 8

permissions:
  contents: write # the scanner commits the playlist via the Contents API
  actions: write  # self-relay reschedules the next run via repository_dispatch

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up proxy (mihomo through YUNA subscription)
        env:
          SUB_URL: ${{ secrets.YUNA_SUB_URL }}
        run: |
          set -euo pipefail
          if [ -z "$SUB_URL" ]; then
            echo "YUNA_SUB_URL secret not set; cannot bypass CDN IP block"
            exit 1
          fi
          MH=$(ls /usr/local/bin/mihomo 2>/dev/null || true)
          if [ -z "$MH" ]; then
            VER=v1.19.30
            curl -sSL -o /tmp/mihomo.gz \
              "https://github.com/MetaCubeX/mihomo/releases/download/${VER}/mihomo-linux-amd64-${VER}.gz"
            gunzip -f /tmp/mihomo.gz
            install -m 0755 /tmp/mihomo /usr/local/bin/mihomo
            MH=/usr/local/bin/mihomo
          fi
          curl -sSL -H 'User-Agent: clash-verge/1.6.6' -o /tmp/sub_full.yaml "$SUB_URL"
          python3 - << 'PYEOF'
          import yaml
          cfg = yaml.safe_load(open('/tmp/sub_full.yaml'))
          names = cfg.get('proxies', [])
          order = [p for p in names if 'VN' in p.get('name', '').upper()] + \
                  [p for p in names if 'SG' in p.get('name', '').upper()]
          keep = order[:10]
          # url-test group: mihomo probes every node every interval and routes
          # through the one with the lowest latency, falling back automatically.
          groups = [{'name': 'POOL', 'type': 'url-test',
                     'proxies': [p['name'] for p in keep],
                     'url': 'http://www.gstatic.com/generate_204',
                     'interval': 120,
                     'tolerance': 50}]
          out = {'mixed-port': 7891, 'allow-lan': False, 'mode': 'rule',
                 'log-level': 'warning', 'proxies': keep,
                 'proxy-groups': groups, 'rules': ['MATCH,POOL']}
          yaml.safe_dump(out, open('/tmp/mihomo_run.yaml', 'w'), allow_unicode=True)
          print('picked (url-test):', [p['name'] for p in keep])
          PYEOF
          $MH -d /tmp -f /tmp/mihomo_run.yaml > /tmp/mihomo.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -s -m 3 -x socks5h://127.0.0.1:7891 https://api.ipify.org > /tmp/exit_ip; then
              break
            fi
            sleep 1
          done
          if [ ! -s /tmp/exit_ip ]; then
            echo "proxy did not come up"; cat /tmp/mihomo.log; exit 1
          fi
          echo "proxy exit IP: $(cat /tmp/exit_ip)"

      - name: Scan and publish on change
        env:
          SCANNER_TOKEN: ${{ secrets.SCANNER_TOKEN }}
          NAMHAU_PROXY: socks5://127.0.0.1:7891
          EPG_URLS: "https://epgshare01.online/epgshare01/epg_ripper_UK1.xml.gz,https://epgshare01.online/epgshare01/epg_ripper_AL1.xml.gz,https://epgshare01.online/epgshare01/epg_ripper_US2.xml.gz,https://epgshare01.online/epgshare01/epg_ripper_CA2.xml.gz,https://epgshare01.online/epgshare01/epg_ripper_FR1.xml.gz,https://epgshare01.online/epgshare01/epg_ripper_PT1.xml.gz,https://epgshare01.online/epgshare01/epg_ripper_MY1.xml.gz,https://epgshare01.online/epgshare01/epg_ripper_NZ1.xml.gz,https://epgshare01.online/epgshare01/epg_ripper_CZ1.xml.gz"
        run: |
          python3 scanner.py \
            --out Socolive.json \
            --m3u-out Socolive.m3u \
            --publish \
            --github-token "$SCANNER_TOKEN" \
            --github-repo hanhk112023-jpg/M3u \
            --github-path Socolive.json \
            --epg "$EPG_URLS"

      - name: Clean up old workflow runs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN: ${{ github.run_id }}
          # Keep the newest N runs per workflow, delete everything older.
          # This prunes the whole history (pages-build + socolive-scan alike),
          # walking pagination so runs beyond the first 100 are also removed.
          KEEP_PER_WORKFLOW: 15
          MAX_PAGES: 40
        run: |
          set -euo pipefail
          echo "current run id = ${CURRENT_RUN}"
          python3 - << 'PYEOF'
          import json, os, subprocess, urllib.request, collections
          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          keep = int(os.environ.get('KEEP_PER_WORKFLOW', '15'))
          max_pages = int(os.environ.get('MAX_PAGES', '40'))
          current = os.environ.get('CURRENT_RUN')

          def page(page):
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/actions/runs?per_page=100&page={page}',
                  headers={'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json',
                           'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(req, timeout=30) as resp:
                  body = json.loads(resp.read().decode())
                  link = resp.headers.get('Link', '')
                  return body.get('workflow_runs', []), 'rel="next"' in link

          # Collect all runs across pages, grouped by workflow name.
          runs_by_wf = collections.defaultdict(list)
          page_no = 1
          while True:
              runs, has_next = page(page_no)
              if not runs:
                  break
              for r in runs:
                  if r['status'] == 'completed':
                      runs_by_wf[r.get('name', '(unknown)')].append(r)
              if not has_next or page_no >= max_pages:
                  break
              page_no += 1

          # A workflow run id belongs to exactly one workflow; delete the oldest
          # beyond KEEP_PER_WORKFLOW for each. Never delete the live run.
          deleted = 0
          for wf_name, wf_runs in runs_by_wf.items():
              wf_runs.sort(key=lambda r: r['run_started_at'])
              excess = wf_runs[:max(0, len(wf_runs) - keep)]
              print(f"{wf_name}: {len(wf_runs)} completed, deleting {len(excess)} oldest")
              for r in excess:
                  if str(r['id']) == current:
                      continue
                  url = f'https://api.github.com/repos/{repo}/actions/runs/{r["id"]}'
                  subprocess.run(
                      ['curl', '-sS', '-o', '/dev/null',
                       '-X', 'DELETE',
                       '-H', f'Authorization: Bearer {token}',
                       '-H', 'Accept: application/vnd.github+json',
                       '-H', 'X-GitHub-Api-Version: 2022-11-28', url])
                  deleted += 1
          print(f"pruned {deleted} old runs total")
          PYEOF

      - name: Relay (self-reschedule next run)
        if: always()
        env:
          PAT: ${{ secrets.SAS_PAT }}
          REPO: ${{ github.repository }}
          # Pause ~5 min so consecutive runs do not pile up; the run that
          # finishes also spawns the next one, so the loop is self-sustaining.
          PAUSE_SECS: 270
        run: |
          set -euo pipefail
          if [ -z "${PAT}" ]; then
            echo "SAS_PAT secret not set; skipping self-reschedule"
            exit 0
          fi
          echo "waiting ${PAUSE_SECS}s to pace the next run..."
          sleep "${PAUSE_SECS}"
          echo "repository_dispatch (via PAT) -> next scan..."
          curl -sS -f -X POST \
            -H "Authorization: Bearer ${PAT}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d '{"event_type":"scan"}' \
            "https://api.github.com/repos/${REPO}/dispatches" \
            -o /dev/null -w "relay dispatch %{http_code}\n"

      - name: Upload scan report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scan-report-${{ github.run_id }}
          path: Socolive.json
          retention-days: 7
          if-no-files-found: ignore
